name: Add new issues to project
on:
  issues:
    types: [opened]
jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: "https://github.com/orgs/koteworld/projects/1"
          github-token: ${{ secrets.REPO_PAT_TOKEN }}
